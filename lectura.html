<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lectura — Primero Baraja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,opsz,wght@0,8..144,300;0,8..144,400;0,8..144,700;1,8..144,300;1,8..144,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --r:#FF0000;--n:#000;--w:#fff;
  --c:#111;--c2:#0a0a0a;
  --b:#252525;--t:#E0E0E0;--s:#666;
  --f:'Roboto Serif',Georgia,serif;
  --nh:64px;
}
html,body{min-height:100vh;background:var(--n);color:var(--t);font-family:var(--f);font-size:17px;font-weight:300;line-height:1.75;}

nav{position:fixed;top:0;left:0;right:0;height:var(--nh);background:#080808;border-bottom:.5px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:0 2rem;z-index:100;}
.nlogo{display:flex;align-items:center;gap:.75rem;text-decoration:none;}
.nword{color:#fff;font-weight:700;font-size:1rem;font-family:var(--f);}
.nlinks{display:flex;gap:2rem;list-style:none;}
.nlinks a{color:var(--s);text-decoration:none;font-size:.8rem;font-weight:400;letter-spacing:.1em;text-transform:uppercase;transition:color .2s;}
.nlinks a:hover{color:#fff;}
.nlinks a.on{color:#fff;border-bottom:1px solid var(--r);padding-bottom:2px;}

.page{padding:calc(var(--nh) + 3rem) 1.5rem 5rem;max-width:700px;margin:0 auto;}

.slabel{font-size:.68rem;font-weight:700;letter-spacing:.25em;text-transform:uppercase;color:var(--r);margin-bottom:.5rem;}
h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:700;line-height:1.1;color:#fff;margin-bottom:.5rem;}
.sub{color:var(--s);font-size:.95rem;margin-bottom:2.5rem;}

hr.div{border:none;border-top:.5px solid var(--b);margin:2rem 0;}

/* MAZO */
.mazo-wrap{display:flex;gap:.75rem;margin-bottom:2rem;}
.mbtn{padding:.45rem 1.1rem;font-family:var(--f);font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--b);background:var(--c);color:var(--s);cursor:pointer;border-radius:2px;transition:all .2s;}
.mbtn.on{border-color:#aaa;background:#222;color:#fff;}

textarea{width:100%;min-height:100px;background:var(--c);border:.5px solid var(--b);border-radius:2px;color:var(--t);font-family:var(--f);font-size:1rem;font-weight:300;line-height:1.7;padding:.9rem 1.1rem;resize:vertical;outline:none;transition:border-color .25s;}
textarea::placeholder{color:#3a3a3a;font-style:italic;}
textarea:focus{border-color:#444;}

.btn{display:block;width:100%;margin-top:1rem;padding:.8rem 1.5rem;font-family:var(--f);font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:2px;border:1.5px solid transparent;transition:all .2s;text-align:center;}
.br{background:var(--r);color:#fff;border-color:var(--r);}
.br:hover{background:#cc0000;}
.br:disabled{opacity:.3;pointer-events:none;}
.bo{background:transparent;color:var(--s);border-color:#333;}
.bo:hover{border-color:#666;color:#fff;}

/* LOADING */
.ldots{display:none;text-align:center;padding:2rem 0;color:var(--s);font-style:italic;font-size:.9rem;}
.ldots.on{display:block;}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#555;margin:0 3px;animation:pu 1.2s infinite;}
.dot:nth-child(2){animation-delay:.2s;}
.dot:nth-child(3){animation-delay:.4s;}
@keyframes pu{0%,80%,100%{opacity:.15}40%{opacity:1}}

/* CARTAS */
#spread-wrap{display:none;}
.spread{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin:1.5rem 0;}
.carta{background:var(--c);border:.5px solid var(--b);border-radius:2px;padding:1.3rem .9rem;text-align:center;opacity:0;transform:translateY(14px);transition:opacity .45s,transform .45s,border-color .2s;}
.carta.show{opacity:1;transform:translateY(0);}
.carta:hover{border-color:#444;}
.cpos{font-size:.6rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--r);margin-bottom:.8rem;}
.cglyph{font-size:2rem;line-height:1;display:block;margin-bottom:.5rem;}
.cnum{font-size:.75rem;color:var(--s);margin-bottom:.2rem;}
.cnombre{font-size:.97rem;font-weight:700;color:#fff;line-height:1.2;margin-bottom:.3rem;}
.ckeys{font-size:.75rem;color:var(--s);font-style:italic;line-height:1.4;}
.cinv{display:inline-block;margin-top:.5rem;font-size:.6rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--r);border:1px solid rgba(255,0,0,.3);padding:2px 6px;border-radius:1px;}

/* LECTURA */
#lectura-wrap{display:none;margin-top:1rem;}
.lbloque{margin-bottom:1.5rem;padding:1.4rem;background:var(--c);border:.5px solid var(--b);border-radius:2px;border-top:2px solid #2a2a2a;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s;}
.lbloque.show{opacity:1;transform:translateY(0);}
.lbloque.sint{background:#0d0d0d;border-top-color:var(--r);}
.lhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1rem;gap:1rem;}
.ltit{font-size:.65rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--s);}
.lcarta{font-size:.85rem;font-weight:700;color:#fff;}
.ltexto{font-size:.95rem;line-height:1.85;color:var(--t);font-weight:300;}
.cita-blq{border-left:2px solid var(--r);padding-left:1rem;margin-top:1.2rem;}
.cita-t{font-size:.9rem;font-style:italic;line-height:1.7;color:#bbb;margin-bottom:.5rem;}
.cita-m{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
.cita-a{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#444;}
.cita-l{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--r);text-decoration:none;border-bottom:1px solid rgba(255,0,0,.3);}
.cita-l:hover{border-color:var(--r);}

#reset-btn{display:none;margin-top:2rem;}
#reset-btn.on{display:block;}

@media(max-width:500px){
  .spread{grid-template-columns:1fr;max-width:220px;margin-left:auto;margin-right:auto;}
  nav{padding:0 1rem;}
  .nlinks{gap:1.2rem;}
}
</style>
</head>

57-15.89,16.82-16.62,3.45-1.01,11.13-.29,11.25,5.05-.38,8.71-20,25.58-27.11,18.57ZM140,145.34l-.21.22c-7.11,7.01-26.73-9.86-27.11-18.57.11-5.35,7.8-6.06,11.25-5.05,1.26.73,12.1,12.05,16.82,16.62,1.1,1.21,1.76,1.5,1.8,2.03.08.52-1.51,3.77-2.55,4.75Z"/></svg>

<div class="page">
  <p class="slabel">Lectura</p>
  <h1>Soltar · Aceptar · Recibir</h1>
  <p class="sub">Tirada de tres arcanos mayores. Las citas provienen de las fuentes del podcast.</p>

  <hr class="div">

  <div id="step1">
    <p class="slabel" style="margin-bottom:1rem">I. Elige el mazo</p>
    <div class="mazo-wrap">
      <button class="mbtn on" onclick="setMazo('marsella',this)">Marsella</button>
      <button class="mbtn" onclick="setMazo('rider',this)">Rider-Waite</button>
    </div>
    <p class="slabel" style="margin-bottom:.8rem">II. Formula tu intención</p>
    <textarea id="int" placeholder="Describe el momento que atraviesas, o formula una pregunta abierta..."></textarea>
    <button class="btn br" id="sbtn" onclick="iniciar()">Barajar y extraer cartas</button>
  </div>

  <hr class="div" id="d1" style="display:none">
  <div class="ldots" id="lshuffle"><p style="margin-bottom:.6rem">Barajando</p><div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>

  <div id="spread-wrap">
    <p class="slabel" style="margin-bottom:1rem">III. Tirada</p>
    <div class="spread" id="spread"></div>
  </div>

  <hr class="div" id="d2" style="display:none">

  <div id="lectura-wrap">
    <p class="slabel" style="margin-bottom:1.2rem">IV. Interpretación</p>
    <div class="ldots" id="lapi"><p style="margin-bottom:.6rem">Leyendo las cartas</p><div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>
    <div id="lcontenido"></div>
  </div>

  <button class="btn bo" id="reset-btn" onclick="reset()">Nueva lectura</button>
</div>

<script>
// ── CITAS ────────────────────────────────────────────────────────────────────
// Edita este array para agregar tus citas curadas.
const CITAS = [
  { id:'el-loco', texto:'El Loco no es un idiota: es alguien que ha decidido vivir sin red de protección.', autor:'Alejandro Jodorowsky', fuente:'La Vía del Tarot', ep:null, url:null, mazo:'marsella' },
  { id:'el-mago', texto:'El Mago tiene ante sí todas las herramientas del universo. La pregunta es si sabe usarlas.', autor:'Rachel Pollack', fuente:'Seventy-Eight Degrees of Wisdom', ep:null, url:null, mazo:'rider' },
  { id:'la-papisa', texto:'La Papisa guarda silencio. Y en ese silencio hay más información que en cualquier respuesta.', autor:'Primero Baraja', fuente:'Episodio 2', ep:2, url:null, mazo:'ambos' },
  { id:'el-ermitano', texto:'El Ermitaño no busca la soledad: la habita. Hay una diferencia.', autor:'Primero Baraja', fuente:'Episodio 3', ep:3, url:null, mazo:'ambos' },
  { id:'la-rueda-de-fortuna', texto:'Que esta carta aparezca en la mitad del mazo tiene la importancia narrativa de un punto medio: el momento en que el personaje gira radicalmente de dirección.', autor:'Primero Baraja', fuente:'Episodio 4', ep:4, url:null, mazo:'ambos' },
  { id:'la-rueda-de-fortuna', texto:'Esta carta siempre me lleva a la misma palabra: aceptar. Aceptar lo que la vida trae, sin compararlo con lo que yo esperaba que trajera.', autor:'Primero Baraja', fuente:'Episodio 4', ep:4, url:null, mazo:'ambos' },
];

// ── ARCANOS ──────────────────────────────────────────────────────────────────
const AM = [
  {id:'el-loco',num:'0',name:'El Loco',g:'🃏',k:'libertad, impulso, salto sin red'},
  {id:'el-mago',num:'I',name:'El Mago',g:'🔮',k:'voluntad, destreza, inicio'},
  {id:'la-papisa',num:'II',name:'La Papisa',g:'📜',k:'conocimiento velado, intuición'},
  {id:'la-emperatriz',num:'III',name:'La Emperatriz',g:'🌿',k:'fecundidad, creación, naturaleza'},
  {id:'el-emperador',num:'IV',name:'El Emperador',g:'⚖️',k:'autoridad, estructura, orden'},
  {id:'el-hierofante',num:'V',name:'El Papa',g:'🔑',k:'transmisión, tradición, guía'},
  {id:'los-enamorados',num:'VI',name:'El Enamorado',g:'⚡',k:'elección, deseo, encrucijada'},
  {id:'el-carro',num:'VII',name:'El Carro',g:'🏹',k:'avance, control, triunfo'},
  {id:'la-justicia',num:'VIII',name:'La Justicia',g:'⚖️',k:'equilibrio, verdad, consecuencias'},
  {id:'el-ermitano',num:'IX',name:'El Ermitaño',g:'🕯️',k:'retiro, discernimiento, sabiduría interior'},
  {id:'la-rueda-de-fortuna',num:'X',name:'La Rueda de Fortuna',g:'☸️',k:'ciclo, cambio, destino'},
  {id:'la-fuerza',num:'XI',name:'La Fuerza',g:'🦁',k:'dominio suave, valentía, persistencia'},
  {id:'el-colgado',num:'XII',name:'El Colgado',g:'🌀',k:'suspensión, sacrificio, otra perspectiva'},
  {id:'la-muerte',num:'XIII',name:'La Muerte',g:'🌑',k:'transformación, final necesario, umbral'},
  {id:'la-templanza',num:'XIV',name:'La Templanza',g:'💧',k:'alquimia, moderación, flujo'},
  {id:'el-diablo',num:'XV',name:'El Diablo',g:'⛓️',k:'atadura, sombra, pulsión no integrada'},
  {id:'la-torre',num:'XVI',name:'La Torre',g:'🌩️',k:'ruptura, revelación súbita, derrumbe'},
  {id:'la-estrella',num:'XVII',name:'La Estrella',g:'⭐',k:'esperanza, renovación, claridad suave'},
  {id:'la-luna',num:'XVIII',name:'La Luna',g:'🌙',k:'ilusión, profundidad inconsciente'},
  {id:'el-sol',num:'XIX',name:'El Sol',g:'☀️',k:'claridad, vitalidad, apertura'},
  {id:'el-juicio',num:'XX',name:'El Juicio',g:'🎺',k:'llamado, renacimiento, discernimiento final'},
  {id:'el-mundo',num:'XXI',name:'El Mundo',g:'🌍',k:'completud, integración, cierre de ciclo'},
];

const AR = AM.map(c=>({...c,
  name: c.name.replace('El Loco','The Fool').replace('El Mago','The Magician').replace('La Papisa','The High Priestess').replace('La Emperatriz','The Empress').replace('El Emperador','The Emperor').replace('El Papa','The Hierophant').replace('El Enamorado','The Lovers').replace('El Carro','The Chariot').replace('La Justicia','Justice').replace('El Ermitaño','The Hermit').replace('La Rueda de Fortuna','Wheel of Fortune').replace('La Fuerza','Strength').replace('El Colgado','The Hanged Man').replace('La Muerte','Death').replace('La Templanza','Temperance').replace('El Diablo','The Devil').replace('La Torre','The Tower').replace('La Estrella','The Star').replace('La Luna','The Moon').replace('El Sol','The Sun').replace('El Juicio','Judgement').replace('El Mundo','The World')
}));

const POS=[
  {k:'SOLTAR',l:'Soltar',d:'Lo que puedes dejar ir'},
  {k:'ACEPTAR',l:'Aceptar',d:'Lo que es'},
  {k:'RECIBIR',l:'Recibir',d:'Lo que viene'},
];

let mazo='marsella', cartas=[];

function setMazo(m,btn){
  mazo=m;
  document.querySelectorAll('.mbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}

function getCita(id){
  const pool=CITAS.filter(c=>c.id===id&&(c.mazo==='ambos'||c.mazo===mazo));
  return pool.length ? pool[Math.floor(Math.random()*pool.length)] : null;
}

function iniciar(){
  const int=document.getElementById('int').value.trim();
  if(!int){
    const ta=document.getElementById('int');
    ta.style.borderColor='rgba(255,0,0,.5)';
    ta.focus();
    setTimeout(()=>ta.style.borderColor='',1500);
    return;
  }
  document.getElementById('sbtn').disabled=true;
  document.getElementById('int').disabled=true;
  document.getElementById('d1').style.display='block';
  document.getElementById('lshuffle').classList.add('on');

  setTimeout(()=>{
    const mazoArr=mazo==='marsella'?AM:AR;
    const sh=[...mazoArr].sort(()=>Math.random()-.5);
    cartas=sh.slice(0,3).map(c=>({...c,rev:Math.random()<.22}));
    document.getElementById('lshuffle').classList.remove('on');
    mostrarSpread();
  },2000);
}

function mostrarSpread(){
  const w=document.getElementById('spread-wrap');
  const g=document.getElementById('spread');
  w.style.display='block'; g.innerHTML='';
  cartas.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='carta';
    d.innerHTML=`<p class="cpos">${POS[i].l}</p><span class="cglyph" style="${c.rev?'display:inline-block;transform:rotate(180deg)':''}">${c.g}</span><p class="cnum">${c.num}</p><p class="cnombre">${c.name}</p><p class="ckeys">${c.k}</p>${c.rev?'<span class="cinv">Invertida</span>':''}`;
    g.appendChild(d);
    setTimeout(()=>d.classList.add('show'),150+i*300);
  });
  setTimeout(mostrarLectura,150+3*300+500);
}

function mostrarLectura(){
  document.getElementById('d2').style.display='block';
  document.getElementById('lectura-wrap').style.display='block';
  document.getElementById('lapi').classList.add('on');
  llamarClaude();
}

async function llamarClaude(){
  const int=document.getElementById('int').value.trim();
  const citasDisp=cartas.map(c=>{
    const pool=CITAS.filter(x=>x.id===c.id&&(x.mazo==='ambos'||x.mazo===mazo));
    return {arc:c.name,citas:pool.map(x=>`"${x.texto}" — ${x.autor}, ${x.fuente}`)};
  });

  const prompt=`Eres el intérprete del podcast Primero Baraja, un podcast sobre tarot que conversa en profundidad sobre los arcanos mayores. Tu lectura es sobria, directa, sin clichés new age. No hablas de "energías" ni "vibraciones". Hablas de experiencia humana concreta.

El consultante dice:
"${int}"

Cartas extraídas (tirada Soltar / Aceptar / Recibir):
${cartas.map((c,i)=>`${POS[i].l}: ${c.name} (${c.num})${c.rev?' — invertida':''}`).join('\n')}

Citas disponibles de las fuentes del podcast:
${citasDisp.map(x=>`[${x.arc}]:\n${x.citas.length?x.citas.join('\n'):'(sin citas aún)'}`).join('\n\n')}

Para cada posición: 2-3 oraciones de interpretación. Luego, si hay citas disponibles para esa carta, integra una textualmente.

Formato exacto, texto plano sin asteriscos ni markdown:

SOLTAR: [interpretación]
CITA_SOLTAR: [cita textual si existe, o NINGUNA]
ACEPTAR: [interpretación]
CITA_ACEPTAR: [cita textual si existe, o NINGUNA]
RECIBIR: [interpretación]
CITA_RECIBIR: [cita textual si existe, o NINGUNA]
SÍNTESIS: [3-4 oraciones sobre el conjunto]`;

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})
    });
    const data=await res.json();
    const txt=data.content?.find(b=>b.type==='text')?.text||'';
    renderLectura(txt);
  }catch(e){renderFallback();}
}

function parsear(txt,key){
  const keys=['SOLTAR','CITA_SOLTAR','ACEPTAR','CITA_ACEPTAR','RECIBIR','CITA_RECIBIR','SÍNTESIS','SINTESIS'];
  const start=txt.indexOf(key+':');
  if(start===-1)return null;
  let end=txt.length;
  for(const k of keys){if(k===key)continue;const p=txt.indexOf(k+':',start+1);if(p!==-1&&p<end)end=p;}
  const v=txt.slice(start+key.length+1,end).trim();
  return(v==='NINGUNA'||v==='')?null:v;
}

function renderLectura(txt){
  document.getElementById('lapi').classList.remove('on');
  const cont=document.getElementById('lcontenido');
  cont.innerHTML='';

  const bloques=[
    {pos:'SOLTAR',citaK:'CITA_SOLTAR',carta:cartas[0],i:0},
    {pos:'ACEPTAR',citaK:'CITA_ACEPTAR',carta:cartas[1],i:1},
    {pos:'RECIBIR',citaK:'CITA_RECIBIR',carta:cartas[2],i:2},
  ];

  bloques.forEach(({pos,citaK,carta,i})=>{
    const interp=parsear(txt,pos);
    if(!interp)return;
    const cita=getCita(carta.id);
    const b=document.createElement('div');
    b.className='lbloque';
    b.innerHTML=`
      <div class="lhead">
        <span class="ltit">${POS[i].l} — ${POS[i].d}</span>
        <span class="lcarta">${carta.name}</span>
      </div>
      <p class="ltexto">${interp}</p>
      ${cita?`<div class="cita-blq"><p class="cita-t">"${cita.texto}"</p><div class="cita-m"><span class="cita-a">${cita.autor} · ${cita.fuente}</span>${cita.url?`<a href="${cita.url}" target="_blank" class="cita-l">Escuchar →</a>`:''}</div></div>`:''}
    `;
    cont.appendChild(b);
    setTimeout(()=>b.classList.add('show'),100+i*200);
  });

  const sint=parsear(txt,'SÍNTESIS')||parsear(txt,'SINTESIS');
  if(sint){
    const bs=document.createElement('div');
    bs.className='lbloque sint';
    bs.innerHTML=`<div class="lhead"><span class="ltit">Síntesis</span></div><p class="ltexto">${sint}</p>`;
    cont.appendChild(bs);
    setTimeout(()=>bs.classList.add('show'),100+3*200+100);
  }

  setTimeout(()=>document.getElementById('reset-btn').classList.add('on'),100+4*200+400);
}

function renderFallback(){
  document.getElementById('lapi').classList.remove('on');
  const cont=document.getElementById('lcontenido');
  cont.innerHTML=`<div class="lbloque show"><p class="ltexto" style="color:var(--s);font-style:italic">No fue posible conectar con el intérprete.<br><br>${cartas.map((c,i)=>`<strong style="color:var(--t)">${POS[i].l}:</strong> ${c.name}${c.rev?' (invertida)':''}`).join('<br>')}</p></div>`;
  document.getElementById('reset-btn').classList.add('on');
}

function reset(){
  document.getElementById('int').value='';
  document.getElementById('int').disabled=false;
  document.getElementById('sbtn').disabled=false;
  document.getElementById('spread').innerHTML='';
  document.getElementById('spread-wrap').style.display='none';
  document.getElementById('lcontenido').innerHTML='';
  document.getElementById('lectura-wrap').style.display='none';
  document.getElementById('d1').style.display='none';
  document.getElementById('d2').style.display='none';
  document.getElementById('reset-btn').classList.remove('on');
  cartas=[];
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
