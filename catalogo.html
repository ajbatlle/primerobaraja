<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo — Primero Baraja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,opsz,wght@0,8..144,300;0,8..144,400;0,8..144,700;1,8..144,300;1,8..144,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --r:#FF0000;--n:#000;--w:#fff;
  --c:#111;--c2:#0a0a0a;
  --b:#252525;--t:#E0E0E0;--s:#666;
  --f:'Roboto Serif',Georgia,serif;
  --nh:64px;
}
html,body{min-height:100vh;background:var(--n);color:var(--t);font-family:var(--f);font-size:17px;font-weight:300;line-height:1.75;}

nav{position:fixed;top:0;left:0;right:0;height:var(--nh);background:#080808;border-bottom:.5px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:0 2rem;z-index:100;}
.nlogo{display:flex;align-items:center;gap:.75rem;text-decoration:none;}
.nword{color:#fff;font-weight:700;font-size:1rem;font-family:var(--f);}
.nlinks{display:flex;gap:2rem;list-style:none;}
.nlinks a{color:var(--s);text-decoration:none;font-size:.8rem;font-weight:400;letter-spacing:.1em;text-transform:uppercase;transition:color .2s;}
.nlinks a:hover{color:#fff;}
.nlinks a.on{color:#fff;border-bottom:1px solid var(--r);padding-bottom:2px;}

/* FILTROS sticky */
.fbar{position:sticky;top:var(--nh);background:var(--n);border-bottom:.5px solid var(--b);z-index:50;padding:.9rem 2rem;}
.finn{max-width:960px;margin:0 auto;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;}
.fbtn{padding:.32rem .85rem;font-family:var(--f);font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--b);background:var(--c);color:var(--s);cursor:pointer;border-radius:40px;transition:all .18s;white-space:nowrap;}
.fbtn:hover{border-color:#444;color:var(--t);}
.fbtn.on{background:#e0e0e0;border-color:#e0e0e0;color:#000;}
.fbtn.pb.on{background:var(--r);border-color:var(--r);color:#fff;}
.bwrap{margin-left:auto;}
.binput{padding:.32rem .85rem;font-family:var(--f);font-size:.88rem;border:1px solid var(--b);background:var(--c);border-radius:40px;outline:none;color:var(--t);transition:border-color .2s;min-width:180px;}
.binput:focus{border-color:#444;}

/* PÁGINA */
.page{padding:calc(var(--nh) + 1rem) 2rem 5rem;max-width:960px;margin:0 auto;}
.slabel{font-size:.68rem;font-weight:700;letter-spacing:.25em;text-transform:uppercase;color:var(--r);margin-bottom:.5rem;}
h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:700;color:#fff;line-height:1.1;margin-bottom:.4rem;}
.sub{color:var(--s);font-size:.95rem;margin-bottom:2rem;}
.count{font-size:.78rem;color:#444;margin-bottom:1.5rem;}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1rem;}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.ccard{background:var(--c);border:.5px solid var(--b);border-radius:2px;padding:1.3rem;display:flex;flex-direction:column;gap:.75rem;transition:border-color .2s,transform .2s;animation:fu .3s ease both;}
.ccard:hover{border-color:#3a3a3a;transform:translateY(-2px);}
.ccard.pb{border-top:2px solid var(--r);}
.ctag{font-size:.62rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--s);}
.ctexto{font-size:.93rem;font-style:italic;line-height:1.7;color:#bbb;flex:1;}
.cfoot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.4rem;padding-top:.6rem;border-top:.5px solid var(--b);}
.cautor{font-size:.67rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#444;}
.clink{font-size:.67rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--r);text-decoration:none;border-bottom:1px solid rgba(255,0,0,.3);}
.clink:hover{border-color:var(--r);}
.vacio{grid-column:1/-1;text-align:center;padding:4rem 0;color:var(--s);font-style:italic;}

@media(max-width:600px){
  .bwrap{margin-left:0;width:100%;}
  .binput{width:100%;}
  .grid{grid-template-columns:1fr;}
  .fbar{padding:.9rem 1.2rem;}
  nav{padding:0 1rem;}
  .nlinks{gap:1.2rem;}
  .page{padding-left:1.2rem;padding-right:1.2rem;}
}
</style>
</head>
<body>

57-15.89,16.82-16.62,3.45-1.01,11.13-.29,11.25,5.05-.38,8.71-20,25.58-27.11,18.57ZM140,145.34l-.21.22c-7.11,7.01-26.73-9.86-27.11-18.57.11-5.35,7.8-6.06,11.25-5.05,1.26.73,12.1,12.05,16.82,16.62,1.1,1.21,1.76,1.5,1.8,2.03.08.52-1.51,3.77-2.55,4.75Z"/></svg>
    <span class="nword">primero baraja</span>
  </a>
  <ul class="nlinks">
    <li><a href="index.html">Inicio</a></li>

</nav>

<div class="fbar">
  <div class="finn" id="finn">
    <button class="fbtn on" onclick="setF('todos',this)">Todos</button>
    <button class="fbtn pb" onclick="setF('podcast',this)">Podcast</button>
    <span id="farc"></span>
    <div class="bwrap"><input class="binput" type="text" id="busq" placeholder="Buscar..." oninput="render()"></div>
  </div>
</div>

<div class="page">
  <p class="slabel">Catálogo</p>
  <h1>Frases y citas</h1>
  <p class="sub">Del podcast y las fuentes que lo nutren. Filtra por arcano o busca por texto.</p>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
</div>

<script>
// ── CITAS ── edita aquí para agregar tus citas ────────────────────────────────
const CITAS=[
  {id:'el-loco',arcano:'El Loco',texto:'El Loco no es un idiota: es alguien que ha decidido vivir sin red de protección.',autor:'Alejandro Jodorowsky',fuente:'La Vía del Tarot',url:null},
  {id:'el-mago',arcano:'El Mago',texto:'El Mago tiene ante sí todas las herramientas del universo. La pregunta es si sabe usarlas.',autor:'Rachel Pollack',fuente:'Seventy-Eight Degrees of Wisdom',url:null},
  {id:'la-papisa',arcano:'La Papisa',texto:'La Papisa guarda silencio. Y en ese silencio hay más información que en cualquier respuesta.',autor:'Primero Baraja',fuente:'Episodio 2',url:null},
  {id:'el-ermitano',arcano:'El Ermitaño',texto:'El Ermitaño no busca la soledad: la habita. Hay una diferencia.',autor:'Primero Baraja',fuente:'Episodio 3',url:null},
  {id:'la-rueda-de-fortuna',arcano:'La Rueda de Fortuna',texto:'Que esta carta aparezca en la mitad del mazo tiene la importancia narrativa de un punto medio: el momento en que el personaje gira radicalmente de dirección.',autor:'Primero Baraja',fuente:'Episodio 4',url:null},
  {id:'la-rueda-de-fortuna',arcano:'La Rueda de Fortuna',texto:'Esta carta siempre me lleva a la misma palabra: aceptar. Aceptar lo que la vida trae, sin compararlo con lo que yo esperaba que trajera.',autor:'Primero Baraja',fuente:'Episodio 4',url:null},
];

let filtro='todos';

// Filtros por arcano
const arcanos=[...new Set(CITAS.map(c=>c.id))];
const nombres={
  'el-loco':'El Loco','el-mago':'El Mago','la-papisa':'La Papisa',
  'la-emperatriz':'La Emperatriz','el-emperador':'El Emperador','el-hierofante':'El Hierofante',
  'los-enamorados':'Los Enamorados','el-carro':'El Carro','la-fuerza':'La Fuerza',
  'el-ermitano':'El Ermitaño','la-rueda-de-fortuna':'La Rueda','la-justicia':'La Justicia',
  'el-colgado':'El Colgado','la-muerte':'La Muerte','la-templanza':'La Templanza',
  'el-diablo':'El Diablo','la-torre':'La Torre','la-estrella':'La Estrella',
  'la-luna':'La Luna','el-sol':'El Sol','el-juicio':'El Juicio','el-mundo':'El Mundo',
};

const farc=document.getElementById('farc');
arcanos.forEach(a=>{
  const b=document.createElement('button');
  b.className='fbtn';
  b.textContent=nombres[a]||a;
  b.onclick=()=>setF(a,b);
  farc.appendChild(b);
});

function setF(f,btn){
  filtro=f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

function render(){
  const q=document.getElementById('busq').value.toLowerCase();
  const grid=document.getElementById('grid');
  grid.innerHTML='';

  let pool=CITAS;
  if(filtro==='podcast') pool=pool.filter(c=>c.autor==='Primero Baraja');
  else if(filtro!=='todos') pool=pool.filter(c=>c.id===filtro);
  if(q) pool=pool.filter(c=>c.texto.toLowerCase().includes(q)||c.autor.toLowerCase().includes(q)||(nombres[c.id]||'').toLowerCase().includes(q));

  document.getElementById('count').textContent=`${pool.length} ${pool.length===1?'cita':'citas'}`;

  if(!pool.length){grid.innerHTML='<div class="vacio">No hay citas con ese filtro.</div>';return;}

  pool.forEach((c,i)=>{
    const pb=c.autor==='Primero Baraja';
    const d=document.createElement('div');
    d.className=`ccard${pb?' pb':''}`;
    d.style.animationDelay=`${i*.04}s`;
    d.innerHTML=`
      <p class="ctag">${nombres[c.id]||c.id}</p>
      <p class="ctexto">"${c.texto}"</p>
      <div class="cfoot">
        <span class="cautor">${c.autor} · ${c.fuente}</span>
        ${c.url?`<a href="${c.url}" target="_blank" class="clink">Escuchar →</a>`:''}
      </div>
    `;
    grid.appendChild(d);
  });
}

render();
</script>
</body>
